<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map Wallpaper Generator | PosterEngine</title>
    <meta
      name="description"
      content="Generate custom map wallpapers for mobile, desktop, and social formats with PosterEngine. Choose a location, theme, layout, and export size."
    />
    <link
      rel="canonical"
      href="https://posterengine.andreapizzetti.com/showcase/map-wallpaper-generator.html"
    />
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="PosterEngine" />
    <meta property="og:title" content="Map Wallpaper Generator" />
    <meta
      property="og:description"
      content="Create map wallpapers for phones, desktop screens, Instagram stories, and more using OpenStreetMap data."
    />
    <meta
      property="og:image"
      content="https://posterengine.andreapizzetti.com/assets/showcase/showcase_2.png"
    />
    <style>
      body {
        margin: 0;
        background: #07131a;
        color: #eef6f5;
        font-family: Inter, system-ui, sans-serif;
      }
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 32px 18px 44px;
      }
      img {
        width: 100%;
        border-radius: 8px;
        border: 1px solid rgba(139, 202, 207, 0.28);
      }
      h1 {
        font-size: clamp(2rem, 6vw, 4rem);
        line-height: 1;
        margin: 0 0 16px;
      }
      p {
        max-width: 720px;
        color: #b8ced9;
        line-height: 1.65;
      }
      a {
        color: #ffffff;
      }
      .cta {
        display: inline-flex;
        margin: 18px 0 28px;
        min-height: 44px;
        align-items: center;
        padding: 0 16px;
        border-radius: 8px;
        background: #f7f0e6;
        color: #07131a;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Map Wallpaper Generator</h1>
      <p>
        Use PosterEngine to create custom map wallpapers for mobile, desktop,
        social posts, and story formats. Quick presets set the layout, layers,
        text, and export settings so you can iterate quickly.
      </p>
      <a class="cta" href="/">Create a Map Wallpaper</a>
      <picture>
        <source
          srcset="/assets/showcase/showcase_2.webp"
          type="image/webp"
        />
        <img
          src="/assets/showcase/showcase_2.png"
          alt="PosterEngine map wallpaper example"
          width="1500"
          height="1414"
          loading="lazy"
          decoding="async"
        />
      </picture>
    </main>
