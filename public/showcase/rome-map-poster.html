<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rome Map Poster Creator | PosterEngine</title>
    <meta
      name="description"
      content="Create a custom Rome map poster with PosterEngine. Design print-ready city map art from OpenStreetMap data and export PNG, PDF, or SVG."
    />
    <link
      rel="canonical"
      href="https://posterengine.andreapizzetti.com/showcase/rome-map-poster.html"
    />
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="PosterEngine" />
    <meta property="og:title" content="Rome Map Poster Creator" />
    <meta
      property="og:description"
      content="Design a print-ready Rome city map poster online with custom themes, typography, markers, and export controls."
    />
    <meta
      property="og:image"
      content="https://posterengine.andreapizzetti.com/assets/showcase/showcase_1.png"
    />
    <style>
      body {
        margin: 0;
        background: #07131a;
        color: #eef6f5;
        font-family: Inter, system-ui, sans-serif;
      }
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 32px 18px 44px;
      }
      img {
        width: 100%;
        border-radius: 8px;
        border: 1px solid rgba(139, 202, 207, 0.28);
      }
      h1 {
        font-size: clamp(2rem, 6vw, 4rem);
        line-height: 1;
        margin: 0 0 16px;
      }
      p {
        max-width: 720px;
        color: #b8ced9;
        line-height: 1.65;
      }
      a {
        color: #ffffff;
      }
      .cta {
        display: inline-flex;
        margin: 18px 0 28px;
        min-height: 44px;
        align-items: center;
        padding: 0 16px;
        border-radius: 8px;
        background: #f7f0e6;
        color: #07131a;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Rome Map Poster Creator</h1>
      <p>
        PosterEngine lets you turn Rome into a clean custom map poster using
        real OpenStreetMap data. Pick the city, tune the layout, add markers,
        adjust typography, and export a print-ready file without an account.
      </p>
      <a class="cta" href="/">Create a Rome Poster</a>
      <picture>
        <source
          srcset="/assets/showcase/showcase_1.webp"
          type="image/webp"
        />
        <img
          src="/assets/showcase/showcase_1.png"
          alt="PosterEngine custom map poster example"
          width="1500"
          height="1414"
          loading="lazy"
          decoding="async"
        />
      </picture>
    </main>
  </body>
</html>
